name: Unstick Pages deployment
on:
  push:
    paths: ['.github/workflows/unstick-pages.yml']
permissions:
  pages: write
  deployments: write
  contents: write
jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Find and cancel the hung deployment
        env:
          T: ${{ secrets.GITHUB_TOKEN }}
          R: ${{ github.repository }}
        run: |
          H=(-H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          A=https://api.github.com/repos/$R
          {
          echo "== deployments for stuck sha"
          curl -s "${H[@]}" "$A/deployments?sha=f12a8ee5c98a44efc023567e8c205efa004d96de&per_page=10" | tee /tmp/d.json | jq -c '.[]|{id,sha,environment,created_at}'
          for id in $(jq -r '.[].id' /tmp/d.json); do
            echo "== pages status $id"; curl -s "${H[@]}" "$A/pages/deployments/$id" ; echo
            echo "== cancel $id"; curl -s -o /dev/null -w '%{http_code}\n' -X POST "${H[@]}" "$A/pages/deployments/$id/cancel"
            echo "== mark error $id"; curl -s -o /dev/null -w '%{http_code}\n' -X POST "${H[@]}" "$A/deployments/$id/statuses" -d '{"state":"error","description":"hung deploy cleared"}'
          done
          echo "== cancel by sha"; curl -s -w '\n%{http_code}\n' -X POST "${H[@]}" "$A/pages/deployments/f12a8ee5c98a44efc023567e8c205efa004d96de/cancel"
          echo "== pages info"; curl -s "${H[@]}" "$A/pages" | jq -c '{status,build_type,source,html_url}'
          } 2>&1 | tee result.txt
      - name: Save result to diag branch
        run: |
          git config user.name "pages-diag"; git config user.email "pages-diag@users.noreply.github.com"
          git checkout --orphan diag-$GITHUB_RUN_ID && git rm -rfq . >/dev/null 2>&1 || true
          cp result.txt r.txt 2>/dev/null || true; git add r.txt && git commit -qm diag && git push -q origin HEAD:refs/heads/diag
