name: Cancel stuck Pages deployment
on:
  push:
    paths: ['.github/workflows/cancel-stuck-pages.yml']
  workflow_dispatch:
permissions:
  pages: write
  deployments: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the hung deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for sha in f12a8ee5c98a44efc023567e8c205efa004d96de a6fa06e6e8618fbe8e561af19dd8efad1a73c06a; do
            code=$(curl -s -o /tmp/out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel")
            echo "$sha -> $code"; cat /tmp/out; echo
          done
