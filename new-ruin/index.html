<style>
:root{--fg:rgba(236,236,236,.74);--dim:rgba(236,236,236,.36);--line:rgba(255,255,255,.16);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#020202;overflow:hidden;color:var(--fg);
  font-family:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
#grid,#wall{position:fixed;display:block}
.vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 95% at 50% 48%,transparent 52%,rgba(0,0,0,.78))}

.hud{position:fixed;left:0;right:0;display:flex;justify-content:space-between;gap:16px;
  font-size:10.5px;line-height:1.55;letter-spacing:.18em;text-transform:uppercase;pointer-events:none;z-index:5;
  padding-left:calc(18px + env(safe-area-inset-left));padding-right:calc(18px + env(safe-area-inset-right))}
.top{top:0;padding-top:calc(16px + env(safe-area-inset-top));align-items:center}
.bottom{bottom:0;padding-bottom:calc(16px + env(safe-area-inset-bottom));align-items:flex-end}
.brand{display:flex;align-items:center;gap:14px}
.logo{display:block;height:17px;width:auto;opacity:.75}
.tm{text-transform:none;letter-spacing:.12em}
.brand b{font-weight:500;color:rgba(255,255,255,.92);letter-spacing:.32em}
.dim{color:var(--dim)}
.r{text-align:right}
.live i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#e8e8e8;margin-right:8px;vertical-align:1px;animation:blink 1.4s steps(2,jump-none) infinite}
.paused .live i{animation:none;background:#555}
@keyframes blink{50%{opacity:.15}}
.prog{display:flex;flex-wrap:wrap;gap:2px;margin-top:7px;max-width:260px}
.prog b{width:7px;height:3px;background:rgba(255,255,255,.16)}
.prog b.on{background:rgba(255,255,255,.85)}
.prog b.now{background:#fff;outline:1px solid #fff}
.ctrls{display:flex;gap:6px;pointer-events:auto}
.ctrls button{background:none;border:0;color:var(--fg);font:inherit;letter-spacing:inherit;
  text-transform:inherit;padding:9px 12px;cursor:pointer;border-radius:0;-webkit-tap-highlight-color:transparent}
.ctrls button:hover{color:#fff}
.ctrls button:focus-visible{outline:1px solid #fff;outline-offset:2px}
.ctrls button[aria-pressed="true"]{color:#fff;text-decoration:underline;text-underline-offset:5px}

#panel{position:fixed;inset:0;z-index:10;background:rgba(2,2,2,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  overflow:auto;display:none;padding:calc(64px + env(safe-area-inset-top)) 24px calc(64px + env(safe-area-inset-bottom))}
#panel.open{display:block}
#panel .in{max-width:34em;margin:0 auto}
#panel .meta{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
#panel h2{font-weight:500;font-size:15px;letter-spacing:.28em;text-transform:uppercase;color:#fff;margin:8px 0 34px}
#panel p{font-size:15px;line-height:1.75;margin:0 0 1.5em;color:rgba(236,236,236,.88)}
#panel .x button{flex:none;padding:9px 12px;text-transform:uppercase;letter-spacing:.18em;font-size:10.5px}
#panel nav button{text-transform:uppercase;letter-spacing:.14em;font-size:10.5px}
#panel .x{position:fixed;top:calc(16px + env(safe-area-inset-top));right:calc(18px + env(safe-area-inset-right))}
#panel nav{display:flex;gap:6px;margin-bottom:40px;flex-wrap:wrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:640px){
  .hud{font-size:9.5px;letter-spacing:.14em}
  .bottom{flex-direction:column;align-items:stretch;gap:12px}
  .ctrls button{flex:1;padding:11px 0}
  .hide-s{display:none}
  .logo{height:12px}
  .brand{gap:10px}
}
</style>
</head>

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hash(a,b=0,c=0){let h=Math.imul(a|0,374761393)+Math.imul(b|0,668265263)+Math.imul(c|0,1442695041);
  h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967296}

function wrap(str,max){const out=[];let cur='';
  for(let w of str.split(' ')){ if(!w) continue;
    while(w.length>max){ if(cur){out.push(cur);cur=''} out.push(w.slice(0,max)); w=w.slice(max) }
    if(!cur) cur=w; else if(cur.length+1+w.length<=max) cur+=' '+w; else {out.push(cur);cur=w} }
  if(cur) out.push(cur); return out}

function layout(){
  const w=innerWidth,h=innerHeight; lastW=w; lastH=h;
  const pc=clamp(w/400,3,4.5);
  P=Math.max(3,Math.round(pc*DPR)); C=Math.floor(w*DPR/P); R=Math.floor(h*DPR/P);
  const W=C*P,H=R*P, cw=W/DPR, ch=H/DPR, ox=(w-cw)/2, oy=(h-ch)/2;
  for(const c of [wall,grid]){c.width=W;c.height=H;Object.assign(c.style,{width:cw+'px',height:ch+'px',left:ox+'px',top:oy+'px'})}
  buf.width=C;buf.height=R;gl.width=C;gl.height=R;
  let dw=C,dh=R; down.forEach(d=>{dw=Math.max(1,Math.ceil(dw/2));dh=Math.max(1,Math.ceil(dh/2));d.width=dw;d.height=dh});
  // LED dot
  const dc=document.createElement('canvas'); dc.width=dc.height=P; const dx=dc.getContext('2d');
  dx.fillStyle='#fff'; dx.beginPath(); dx.arc(P/2,P/2,P*0.38,0,Math.PI*2); dx.fill();
  dotPat=m.createPattern(dc,'repeat');
  // unlit LEDs + cabinet seams
  const gx=grid.getContext('2d'); gx.clearRect(0,0,W,H);
  gx.globalAlpha=0.06; gx.fillStyle=gx.createPattern(dc,'repeat'); gx.fillRect(0,0,W,H);
  gx.globalAlpha=1; gx.fillStyle='rgba(0,0,0,.9)';
  const cab=C>200?48:32;
  for(let x=cab;x<C;x+=cab) gx.fillRect(x*P-1,0,2,H);
  for(let y=cab;y<R;y+=cab) gx.fillRect(0,y*P-1,W,2);
  // safe rows below/above the HUD
  const tp=document.getElementById('hudTop').getBoundingClientRect().bottom+10;
  const bp=document.getElementById('hudBot').getBoundingClientRect().top-10;
  TOP=Math.ceil((tp-oy)*DPR/P); BOT=Math.floor((bp-oy)*DPR/P);
  MARG=Math.max(4,Math.round(C*0.05));
}

/* ---------- clock ---------- */
let now=0, paused=false; const waiters=[]; const CANCEL={};
function sleep(k,sec){return new Promise(res=>waiters.push({t:now+sec,res,k})).then(()=>{if(k.dead) throw CANCEL})}
function tickWaiters(){for(let i=waiters.length-1;i>=0;i--){const w=waiters[i]; if(w.k.dead||now>=w.t){waiters.splice(i,1);w.res()}}}

let E=[];
class El{constructor(k,delay){this.k=k;this.t0=now+(delay||0);this.inEnd=0;this.hold=0;this.outDur=0.6}
  get end(){return this.inEnd+this.hold+this.outDur+0.3}}

class Txt extends El{
  constructor(k,o){super(k,o.delay);
    Object.assign(this,{s:1,col:'W',a:1,mode:'scramble',rate:0.03,cursor:false,cursorAfter:false,outDur:0.6},o);
    this.str=norm(o.text); const n=this.str.length, inDur=o.inDur??0.9;
    this.app=new Float32Array(n); this.rin=new Float32Array(n); this.rout=new Float32Array(n); this.seed=rint(1e9);
    for(let i=0;i<n;i++){
      if(this.mode==='type'){this.app[i]=this.rin[i]=i*this.rate}
      else if(RM){this.app[i]=this.rin[i]=0}
      else {this.app[i]=(i/Math.max(1,n))*inDur*0.35+Math.random()*0.1; this.rin[i]=this.app[i]+0.12+Math.random()*inDur*0.65}
      this.rout[i]=RM?0:Math.random()*this.outDur*0.75;
    }
    let mx=0; for(let i=0;i<n;i++) mx=Math.max(mx,this.rin[i]);
    this.inEnd=mx+(this.mode==='type'?this.rate:0); this.hold=o.hold??1.5;
  }
  draw(ctx){const t=now-this.t0; if(t<0) return true; if(t>this.end) return false;
    const outT=t-(this.inEnd+this.hold), s=this.s, str=this.str, tick=Math.floor(now*15);
    let shown=-1;
    for(let i=0;i<str.length;i++){ if(t<this.app[i]) continue; shown=i; const ch=str[i]; if(ch===' ') continue;
      let c=ch,a=this.a;
      if(t<this.rin[i]){c=noiseCh(this.seed+i,tick);a*=0.5}
      if(outT>0){ if(RM){a*=Math.max(0,1-outT/0.4)} else {const d=outT-this.rout[i]; if(d>0.22) continue; if(d>0){c=noiseCh(this.seed+i*7,tick);a*=0.45}} }
      glyph(ctx,c,this.x+i*6*s,this.y,s,this.col,a) }
    if(this.cursor&&outT<0){ const typing=t<this.inEnd;
      if(typing||(this.cursorAfter&&Math.floor(t*2.4)%2===0)) glyph(ctx,'█',this.x+(shown+1)*6*s,this.y,s,this.col,this.a*0.9) }
    return true}
}

  draw(ctx){const t=now-this.t0; if(t<0) return true; if(t>this.end) return false;
    const p=Math.min(1,t/this.dur), v=Math.round(this.from+(this.to-this.from)*(1-Math.pow(1-p,3)));
    const str=String(v).padStart(this.w,'0'), outT=t-(this.inEnd+this.hold), s=this.s, tick=Math.floor(now*15);

class Blocks extends El{

  const longest=Math.max(...all.split(' ').map(w=>w.length));
  let s=o.maxS||((L.length===1&&L[0].length<=13)?4:3), rows;
  for(;s>=1;s--){const mc=maxChars(s); if(longest>mc&&s>1) continue;
    rows=L.flatMap(l=>wrap(l,mc)); if(rows.length*LH*s<=H()*0.8||s===1) break}
  const h=rows.length*LH*s-3*s, y0=TOP+Math.round((H()-h)/2);
  const left=o.align==='left', inDur=o.inDur??clamp(0.5+all.length*0.012,0.7,1.4);
  const els=rows.map((r,i)=>{const w=r.length*6*s-s;
    return new Txt(k,{text:r,x:left?MARG:Math.round((C-w)/2),y:y0+i*LH*s,s,col:o.col||'W',delay:i*0.12,inDur,outDur:0.6,pl:true})});
  syncExit(els,o.hold??readHold(all)); markup(k,els,o); add(els);
  await sleep(k,Math.max(0.2,sceneEnd(els)-(o.overlap||0)));
}
async function sSeq(k,lines,o={}){
  for(let i=0;i<lines.length;i++){const last=i===lines.length-1;
    await sResolve(k,[lines[i]],{...o,hold:clamp(0.9+lines[i].length*0.05,1.3,3.6),overlap:last?0:0.35})}
}
const CODES=['( )','(O)','(O-)','(O--<','(OO)','(_)','(/)','(..)','[ ]','(=)','(O_O)','((Y))','(-)','(*)'];
async function sList(k,lines,o={}){
  const codes=o.codes!==false&&maxChars(1)>=40, cw=codes?6:0, mc=maxChars(1)-cw-1;
  const rows=[]; lines.forEach(l=>wrap(norm(l),mc).forEach((r,j)=>rows.push({r,first:j===0})));
  if(rows.length*LH>H()&&lines.length>1){const hh=Math.ceil(lines.length/2); await sList(k,lines.slice(0,hh),o); return sList(k,lines.slice(hh),o)}
  const h=rows.length*LH, y0=TOP+Math.round((H()-h)*0.42), x0=MARG+cw*6, rate=o.rate||0.026;
  let d=0; const els=[];
  rows.forEach((row,i)=>{const y=y0+i*LH;
    if(codes&&row.first) els.push(new Txt(k,{text:CODES[rint(CODES.length)],x:MARG,y,mode:'type',rate:0.02,delay:d,col:'W',a:0.8}));
    els.push(new Txt(k,{text:row.r,x:x0,y,mode:'type',rate,delay:d,cursor:true,cursorAfter:i===rows.length-1,col:o.col||'G',pl:true}));
    d+=row.r.length*rate+(row.first?0.2:0.08)});
  if(codes&&C>220){const bx=C-MARG-24, by=y0+LH*Math.min(rows.length-1,2+rint(3));
    els.push(new Blocks(k,{pts:[[bx,by],[bx,by+16],[bx-12,by+26]],delay:0.6}))}
  syncExit(els,o.hold??readHold(lines.join(' '))); markup(k,els,o); add(els); await sleep(k,sceneEnd(els));
}
async function sTally(k,lines,o={}){
  const numW=4; let s=2, mc=maxChars(2)-numW-2;
  const fits2=lines.every(l=>norm(l).length<=mc)&&(lines.length+2)*LH*2<=H();
  if(!fits2){s=1; mc=maxChars(1)-numW-2}
  const rows=[]; lines.forEach((l,li)=>{const w=wrap(norm(l),mc); w.forEach((r,j)=>rows.push({r,li,last:j===w.length-1}))});
  if((rows.length+2)*LH*s>H()&&lines.length>1){const hh=Math.ceil(lines.length/2);
    await sTally(k,lines.slice(0,hh),o); return sTally(k,lines.slice(hh),{...o,cum:o.cum+words(lines.slice(0,hh))})}
  const h=(rows.length+1.6)*LH*s, y0=TOP+Math.round((H()-h)/2)+LH*s*0.6, xr=C-MARG; let d=0, cum=o.cum||0; const els=[];
  els.push(new Txt(k,{text:'WORDS',x:xr-(5*6-1)*s,y:y0-LH*s,s,mode:'type',rate:0.04,col:'A',a:0.5}));
  rows.forEach((row,i)=>{const y=y0+i*LH*s;
    els.push(new Txt(k,{text:row.r,x:MARG,y,s,delay:d,inDur:0.45,col:'A',pl:true}));
    if(row.last){const wc=words([lines[row.li]]); els.push(new Num(k,{xr,y,s,from:cum,to:cum+wc,delay:d+0.2,w:numW})); cum+=wc}
    d+=0.34});
  const dn=Math.floor((C-2*MARG)/(6*s)/2);
  els.push(new Txt(k,{text:'- '.repeat(dn),x:MARG,y:y0+rows.length*LH*s+2*s,s,mode:'type',rate:0.008,delay:d,col:'A',a:0.85}));
  syncExit(els,o.hold??readHold(lines.join(' '))); markup(k,els,o); add(els); await sleep(k,sceneEnd(els));
}
async function sScatter(k,lines,o={}){
  let s=maxChars(2)>=26?2:1, rows, G;
  const build=()=>{const mc=maxChars(s); rows=[]; lines.forEach((l,li)=>wrap(norm(l),mc).forEach((r,j)=>rows.push({r,li,j}))); G=Math.floor(H()/(LH*s))};
  build(); if(rows.length>G&&s===2){s=1;build()}
  if(rows.length>G*0.55&&lines.length>1){const hh=Math.ceil(lines.length/2); await sScatter(k,lines.slice(0,hh),o); return sScatter(k,lines.slice(hh),o)}
  const cols=maxChars(s), span=Math.min(G,rows.length*2+2), start=Math.floor((G-span)/2);
  const pool=[]; for(let i=0;i<span;i++) pool.push(start+i);
  while(pool.length>rows.length) pool.splice(rint(pool.length),1);
  const reserved=new Set(pool), els=[], lineX={};
  rows.forEach((row,i)=>{ if(row.j===0) lineX[row.li]=rint(Math.max(1,cols-row.r.length+1));
    const gx=Math.min(lineX[row.li],cols-row.r.length);
    els.push(new Txt(k,{text:row.r,x:MARG+gx*6*s,y:TOP+pool[i]*LH*s,s,delay:0.3+i*0.42,inDur:1.2,col:o.col||'W',pl:true}))});
  const ws=[...new Set(POEMS.flatMap(p=>p.stanzas.flat()).join(' ').split(/\s+/).map(norm).filter(w=>w.length>3))];
  els.push(new Field(k,{cols,rows:G,x0:MARG,y0:TOP,s,reserved,density:0.15,col:'W',words:ws}));
  syncExit(els,o.hold??readHold(lines.join(' '))); markup(k,els,o); add(els); await sleep(k,sceneEnd(els));
}
async function sWall(k,cfg,pid){const w=new Wall(k,{...cfg,pid}); add([w]); await sleep(k,w.end)}
async function sBars(k,title,sub){const bars=new Bars(k,{title,sub}); const els=[bars]; if(bars.sub) els.push(bars.sub); add(els); await sleep(k,sceneEnd(els))}

/* ---------- director ---------- */
const ROT=['list','scatter','tally','seq']; let rotI=0;
function pickMode(st,prev){const n=st.length, avg=st.join(' ').length/n;
  if(n<=2) return 'resolve';
  for(let j=0;j<ROT.length;j++){const md=ROT[(rotI+j)%ROT.length]; if(md===prev) continue; if(md==='seq'&&(avg>22||n>7)) continue;
    rotI=(rotI+j+1)%ROT.length; return md} return 'list'}
const HAZE_FOR={resolve:'mono',seq:'mono',list:'rg',tally:'amber',scatter:'mono'};
const LABEL={scribble:'Scribble',resolve:'Resolve',seq:'Sequence',list:'Log',tally:'Tally',scatter:'Field',wall:'Data wall',bars:'Title'};

let tok={dead:true}, cur=0;
async function boot(k){
  setHud(null,0,'bars'); haze('blue');
  await sBars(k,'NEW RUIN','ARCHIVE // JOURNAL POETRY');
  haze('rg'); setHud(null,0,'list');
  await sList(k,['> MOUNTING JOURNAL ARCHIVE','> '+POEMS.length+' ENTRIES FOUND','> '+POEMS.map(p=>p.id).join('  '),'> BEGIN TRANSMISSION'],{codes:false,hold:1.4,rate:0.022,nomark:true});
  haze('dark'); await sleep(k,0.8);
}
async function playPoem(k,p){
  const dir=DIRECTION[p.id]||{}; let prev=null, cum=0; rotI=0; curPid=p.id; usedMarks=new Set();
  setHud(p,0,'bars'); haze('blue');
  await sBars(k,p.title||p.code,p.title?`${p.code} // ${p.date}`:`JOURNAL POETRY // ${p.date}`);
  haze('dark'); await sleep(k,0.5);
  for(let si=0;si<p.stanzas.length;si++){const st=p.stanzas[si];
    const ov=Object.entries(dir.modes||{}).find(([key])=>st[0].startsWith(key))?.[1]||{};
    const mode=ov.mode||pickMode(st,prev);
    setHud(p,si+1,mode); haze(ov.haze||HAZE_FOR[mode]); sr.textContent=st.join(' / ');
    const o={col:ov.col};
    if(mode==='resolve') await sResolve(k,st,o);
    else if(mode==='seq') await sSeq(k,st,o);
    else if(mode==='list') await sList(k,st,o);
    else if(mode==='tally') await sTally(k,st,{...o,cum});
    else await sScatter(k,st,o);
    cum+=words(st); prev=mode;
    const w=(dir.walls||[]).find(w=>st.some(l=>l.includes(w.after)));
    if(w){await sleep(k,0.25); setHud(p,si+1,'wall'); haze('wall'); await sWall(k,w,p.id); prev='wall'}
    if((si===Math.floor(p.stanzas.length/3)||si===Math.floor(p.stanzas.length*2/3))&&prev!=='wall'&&si<p.stanzas.length-1){
      const pool=Object.keys(dir.marks||{}).filter(w=>w.length<=16);
      await sleep(k,0.2); setHud(p,si+1,'scribble'); await sScribble(k,pool.sort(()=>Math.random()-0.5)); prev='scribble'}
    await sleep(k,0.35);
  }
  haze('dark'); await sleep(k,1.4);
}
async function run(start,withBoot){
  const k=tok={dead:false};
  try{
    if(withBoot) await boot(k);
    for(let i=start;;i=(i+1)%POEMS.length){cur=i; setHash(i); await playPoem(k,POEMS[i]); if(i===POEMS.length-1) await boot(k)}
  }catch(e){if(e!==CANCEL) console.error(e)}
}
function jump(i){tok.dead=true; markBusy=0; E=E.filter(e=>!e.k||!e.k.dead); haze('dark'); run((i+POEMS.length)%POEMS.length,false)}

/* ---------- HUD ---------- */
const $=id=>document.getElementById(id);
const sr=$('sr'), hudCode=$('code'), hudMeta=$('meta'), hudMode=$('mode'), hudProg=$('prog'), tcEl=$('tc');
let progFor=null;
function setHud(p,si,mode){
  if(!p){hudCode.textContent='NEW RUIN'; hudMeta.textContent=''; hudMode.textContent='Boot // '+LABEL[mode]; hudProg.innerHTML=''; progFor=null; return}
  hudCode.textContent=p.title?`${p.code} — ${p.title}`:p.code;
  hudMeta.textContent=si?`${String(si).padStart(2,'0')}/${String(p.stanzas.length).padStart(2,'0')}`:'';
  hudMode.textContent=`Ch.${String(POEMS.indexOf(p)+1).padStart(2,'0')} // ${LABEL[mode]}`;
  if(progFor!==p){hudProg.innerHTML=p.stanzas.map(()=>'<b></b>').join(''); progFor=p}
  [...hudProg.children].forEach((el,i)=>{el.className=i+1<si?'on':i+1===si?'now':''});
}
function tc(){const f=Math.floor(now*24)%24, s=Math.floor(now)%60, mi=Math.floor(now/60)%60, h=Math.floor(now/3600);
  return [h,mi,s,f].map(v=>String(v).padStart(2,'0')).join(':')}
function setPaused(v){paused=v; document.body.classList.toggle('paused',v);
  $('bPlay').textContent=v?'Play':'Pause'; $('bPlay').setAttribute('aria-label',v?'Play':'Pause')}

/* ---------- text panel ---------- */
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openPanel(i){const p=POEMS[i];
  $('panelIn').innerHTML=`<nav class="ctrls">${POEMS.map((q,j)=>`<button data-i="${j}" aria-pressed="${j===i}">${q.code}</button>`).join('')}</nav>
    <div class="meta">${esc(p.code)} // Journal Poetry // ${esc(p.date)}</div><h2>${esc(p.title||'Untitled')}</h2>
    ${p.stanzas.map(st=>`<p>${st.map(esc).join('<br>')}</p>`).join('')}`;
  $('panel').classList.add('open'); $('panel').setAttribute('aria-hidden','false'); $('panel').scrollTop=0;
  $('panelIn').querySelectorAll('nav button').forEach(bt=>bt.onclick=()=>openPanel(+bt.dataset.i));
  wasPaused=paused; setPaused(true); $('bClose').focus()}
let wasPaused=false;
function closePanel(){$('panel').classList.remove('open'); $('panel').setAttribute('aria-hidden','true'); setPaused(wasPaused); $('bText').focus()}

/* ---------- hash routing (#jp-092324) ---------- */
let ignoreHash=false;
function setHash(i){const h='#jp-'+POEMS[i].id; if(location.hash!==h){ignoreHash=true; location.hash=h}}
function hashIndex(){const m=location.hash.match(/^#jp-(\d{6})$/); if(!m) return -1; return POEMS.findIndex(p=>p.id===m[1])}
addEventListener('hashchange',()=>{if(ignoreHash){ignoreHash=false;return} const i=hashIndex(); if(i>=0&&i!==cur) jump(i)});

/* ---------- wiring ---------- */
$('bPrev').onclick=()=>jump(cur-1);
$('bNext').onclick=()=>jump(cur+1);
$('bPlay').onclick=()=>setPaused(!paused);
$('bText').onclick=()=>openPanel(cur);
$('bClose').onclick=closePanel;
addEventListener('keydown',e=>{
  if($('panel').classList.contains('open')){if(e.key==='Escape') closePanel(); return}
  if(e.key==='ArrowRight') jump(cur+1); else if(e.key==='ArrowLeft') jump(cur-1);
  else if(e.key===' '){e.preventDefault(); setPaused(!paused)} else if(e.key==='t'||e.key==='T') openPanel(cur)});
let rz; addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{
  if(innerWidth===lastW&&Math.abs(innerHeight-lastH)<lastH*0.2) return; layout(); jump(cur)},250)});


/* ---------- loop ---------- */
let last=performance.now();
function frame(ts){const dt=Math.min(0.1,(ts-last)/1000); last=ts; if(!paused) now+=dt;
  tickWaiters();
  b.globalAlpha=1; b.clearRect(0,0,C,R); b.imageSmoothingEnabled=false;
  ambient(b);
  E=E.filter(e=>!(e.k&&e.k.dead)&&e.draw(b)!==false);
  glitch(); composite(); tcEl.textContent=tc();
  requestAnimationFrame(frame)}

layout(); haze('dark');
const hi=hashIndex();
if(hi>=0) run(hi,false); else run(0,true);
requestAnimationFrame(frame);
window.__nr={get now(){return now}, get E(){return E}, demo(kind){tok.dead=true; E=[]; const k=tok={dead:false}; const p=POEMS[1]; curPid='092524'; usedMarks=new Set(); markBusy=0;
  const go={wall:()=>sWall(k,DIRECTION['092424'].walls[0],'092424'),tally:()=>sTally(k,p.stanzas[4],{cum:40}),
    list:()=>sList(k,POEMS[2].stanzas[3]),scatter:()=>sScatter(k,POEMS[2].stanzas[1]),seq:()=>sSeq(k,p.stanzas[23]),scribble:()=>sScribble(k,Object.keys(DIRECTION['092524'].marks))}[kind];
   go().catch(()=>{})}};
})();
</script>
