<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAGA _ Visual and Narrative Multimedia Archive™ by Noah Conopask</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap">
<style>
:root{--bg:#0c0c0b;--fg:#ecebe6;--muted:#9a978f;--rule:#2c2c29;--well:#161615}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Roboto Mono',ui-monospace,monospace;font-size:clamp(10px,.714vw,12px);line-height:1.6;font-weight:400;text-transform:uppercase;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{opacity:.7}
img{display:block}
button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible{outline:1px solid currentColor;outline-offset:4px}
.wrap{max-width:1280px;margin:0 auto;padding:0 clamp(20px,5vw,80px)}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:24px;padding-top:40px}
.mark{display:inline-block;line-height:1}.mark img{display:inline-block;vertical-align:baseline;height:40px;width:auto}
.plogo{height:14px;width:auto;display:block}
nav{display:flex;flex-wrap:wrap;column-gap:14px;row-gap:4px;align-items:baseline}
nav a{padding:14px 0}
nav .sub{color:var(--muted);margin-right:14px}
.lede{padding:96px 0 56px;margin:0;max-width:none;font-size:min(clamp(28px,3.4vw,46px),calc((100vw - 2 * clamp(20px,5vw,80px)) / 16.6));line-height:1.12;font-weight:400;letter-spacing:-.02em;text-transform:none;color:#808080}

/* viewer */
#viewer{scroll-margin-top:24px}
.vbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:16px}
.icon{width:44px;height:44px;display:flex;align-items:center;justify-content:center}
.vbar .icon:first-child{justify-content:flex-start}.vbar .icon:last-child{justify-content:flex-end}
.count{font-variant-numeric:tabular-nums}
.stage{position:relative;width:100%;overflow:hidden;background:#000;transition:opacity .35s ease}
.stage.swap{opacity:0}
.stage>img,.stage .still img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage .still{position:absolute;inset:0;width:100%;height:100%}
.stage.cover>img,.stage.cover .still img{object-fit:cover}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .9s ease}
.stage.live iframe{opacity:1}
.stage .hit{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.stage .play{position:absolute;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;color:#fff;pointer-events:none}
.stage.live .play{opacity:0;pointer-events:none}
.stage .play span{display:flex;align-items:center;justify-content:center}
.trow{display:flex;align-items:center;gap:4px;padding-top:10px}
.trow .icon{flex:0 0 auto}
.trow .icon[hidden]{display:none}
#thumbs{flex:1 1 auto;min-width:0;position:relative;display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px;scroll-behavior:smooth}
#thumbs::-webkit-scrollbar{display:none}
.th{position:relative;flex:0 0 calc((100% - 96px)/9);min-width:96px;scroll-snap-align:start;opacity:.5;outline:1px solid transparent;outline-offset:3px;transition:opacity .2s}
.th:hover{opacity:.8}
.th[aria-current="true"]{opacity:1;outline-color:#404040}
.th img{width:100%;object-fit:contain;background:#000}
.th.cover img{object-fit:cover}
.th .pi{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff}
.cap{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding-top:12px}
.cap h2{margin:0;font-size:inherit;font-weight:400}
.cap .tag{color:var(--muted)}
.cap .state{margin-left:auto;font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--muted);min-height:44px;display:flex;align-items:center}
.cap .state:hover{color:var(--fg)}
.cap .state[hidden]{display:none}
.credits{margin:6px 0 0;color:var(--muted)}

/* index */
#index{padding:112px 0 120px;display:flex;flex-direction:column;gap:48px}
.ihead{display:flex;justify-content:space-between;align-items:baseline;color:var(--muted)}
.ihead b{color:var(--fg);font-weight:400}
#rows{display:flex;flex-direction:column;gap:44px}
.row{display:flex;flex-wrap:wrap;gap:32px 24px}
.tile{display:block;width:100%;text-align:left}
.tile img{width:100%;aspect-ratio:3/2;object-fit:cover;transition:opacity .2s}
.tile:hover img{opacity:.8}
.tl{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:2px;align-items:baseline;padding-top:12px}
.tl .t{font-weight:400;grid-column:1;text-wrap:balance}
.nw{white-space:nowrap}
.tl .g{color:var(--muted)}
.narrow .tl .g{grid-column:1 / -1}
.wide .tl .g{grid-column:2;white-space:nowrap;padding-left:16px}
@media (max-width:700px){.wide .tl .g{grid-column:1 / -1;padding-left:0;white-space:normal}}
footer{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 24px;padding:16px 0 40px;color:var(--muted)}
footer div{display:flex;flex-wrap:wrap;gap:28px}
/* screening room */
body.screening{overflow:hidden}
.player{position:fixed;inset:0;z-index:50;background:#0c0c0b;display:flex;flex-direction:column;opacity:0;visibility:hidden;transition:opacity .6s ease,visibility 0s linear .6s}
.player.on{opacity:1;visibility:visible;transition:opacity .6s ease}
.ptop .home{justify-self:start;line-height:0}
.ptop{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:15px 14px}
.ptop .pcount{justify-self:end;color:var(--muted);font-variant-numeric:tabular-nums}
.pmid{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(8px,6vw,160px);padding:0 clamp(8px,2vw,28px)}
.pmid .icon:disabled{opacity:.25;cursor:default}
.pframe{position:relative;flex:0 1 auto;width:min(1650px,calc(100vw - 200px),calc((100vh - 230px) * var(--arn,1.7778)));aspect-ratio:var(--ar,16/9);background:#000;overflow:hidden;transition:opacity .45s ease}
.pframe.swap{opacity:0}
.pframe img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.pframe iframe{position:absolute;inset:0;width:100%;height:100%;border:0;opacity:0;transition:opacity .9s ease}
.pframe.live iframe{opacity:1}
.pframe .hit{position:absolute;inset:0;width:100%;height:100%;z-index:2}
.pcap{text-align:center;padding:20px 14px 32px;display:flex;flex-direction:column;gap:2px;align-items:center;transition:opacity .45s ease}
.pcap.swap{opacity:0}
.pcap .pt{color:var(--muted)}
.pcap .ps{margin-top:10px;color:var(--muted);padding:10px 0}
.pcap .ps:hover{color:var(--fg)}
@media (max-width:700px){.pframe{width:calc(100vw - 24px)}.pmid .icon{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
<a class="mark home" href="./" aria-label="SAGA, home"><img src="img/saga-logo.png" alt="SAGA" width="265" height="40"></a>
<nav>
<a href="#index">Index</a>
<a href="#">About</a>
<a href="#">Contact</a>
</nav>
</header>

<p class="lede"><span class="nw">Make Against The Odds.</span><br><span class="nw">For Film, Brands + Culture.</span></p>

<section id="viewer" aria-label="Featured project">
<div class="vbar">
<button type="button" class="icon" id="prev" aria-label="Previous project"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
<span class="count">Projects ( <span id="counter">01 / 12</span> )</span>
<button type="button" class="icon" id="next" aria-label="Next project"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7.5 4 6 6-6 6"/></svg></button>
</div>
<div class="stage" id="stage"></div>
<div class="trow" id="trow">
<button type="button" class="icon" id="tback" aria-label="Scroll thumbnails left" hidden><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
<div id="thumbs"></div>
<button type="button" class="icon" id="tfwd" aria-label="Scroll thumbnails right" hidden><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7.5 4 6 6-6 6"/></svg></button>
</div>
<div class="cap">
<h2 id="ct"></h2>
<span class="tag" id="cg"></span>
</div>
<p class="credits">[Info / credits]</p>
</section>

<section id="index" aria-label="Index">
<div id="rows"></div>
</section>

<footer>
<span>Saga _ Noah Conopask, Los Angeles</span>
<div>
<a href="https://noah.tv">noah.tv</a>
<a href="https://www.instagram.com/noahconopask">Instagram</a>
<a href="#">[CONTACT EMAIL]</a>
</div>
</footer>
</div>

<div id="player" class="player" tabindex="-1" role="dialog" aria-modal="true" aria-label="Film player" aria-hidden="true">
<div class="ptop"><a class="home" href="./" aria-label="SAGA, home"><img class="plogo" src="img/saga-logo.png" alt="SAGA"></a><button type="button" class="icon pclose" aria-label="Close film"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 4l14 14M18 4 4 18"/></svg></button><span class="pcount" id="pcount">01 / 01</span></div>
<div class="pmid">
<button type="button" class="icon" id="pprev" aria-label="Previous film"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6"/></svg></button>
<div class="pframe" id="pframe"></div>
<button type="button" class="icon" id="pnext" aria-label="Next film"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m7.5 4 6 6-6 6"/></svg></button>
</div>
<div class="pcap" id="pcap"><div id="pclient"></div><div class="pt" id="ptitle"></div><button type="button" class="ps" id="pstate">PAUSE</button></div>
</div>

<script>
const I=n=>'img/'+n+'.jpg';
const P=[
 {n:'01',title:'American Symphony',tag:'Film identity & main titles',tile:'american-symphony-hi',fit:'contain',aspect:'16 / 9',frames:[
  ['as-1-title','American Symphony main title over a pale sky with a line of birds'],['as-2-netflix','A Netflix Documentary title card'],['as-3-heineman','A film by Matthew Heineman, over a close profile of Jon Batiste'],['as-4-batiste','Music by Jon Batiste, over a lake at dusk'],['as-5-ourtime','An Our Time Projects production, over moving water'],['as-6-endcard','End title card']]},
 {n:'02',title:'The Company',tag:'Main titles',tile:'the-company-hi',fit:'contain',frames:[
  {vimeo:'479053999',poster:'co-1-title',alt:'The Company main title sequence',film:'Main title sequence'},
  ['co-1-title','The Company main title on hand-drawn paper texture'],['co-2-tnt','TNT presents, two hares under a drawn sky'],['co-3-sony','In association with Sony Pictures Television, a rocket launch'],['co-4-odonnell','Starring Chris O’Donnell, a drawn box'],['co-5-molina','Alfred Molina, a hare with a white eye'],['co-6-keaton','And Michael Keaton, a figure seen from above'],['co-7-calley','Executive producer John Calley, a mushroom cloud over a city'],['co-8-scott','Executive producers Ridley Scott and Tony Scott, a mushroom in grass'],['co-9-book','An open book of drawings']]},
 {n:'03',title:'Cruel Black Dove _ The Myth and the Sum',tag:'Music packaging',tile:'cbd-tile',fit:'cover',frames:[['cbd-1','Cruel Black Dove, The Myth and the Sum, black box set with white type, front'],['cbd-2','Cruel Black Dove box set, back cover with track list and credits']]},
 {n:'04',title:'New Ruin _ Slither',tag:'Music packaging',tile:'nr-1b-tile',fit:'cover',frames:[['nr-1b','New Ruin, Slither, record sleeve on a concrete ledge under a single light'],['nr-2','New Ruin, Slither, close detail of the sleeve edge and title type']]},
 {n:'05',title:'Arctic Hospital',tag:'Music promo',tile:'ah-tile',fit:'cover',frames:[{vimeo:'1244331872',poster:'ah-poster',alt:'Arctic Hospital, Cold Wrapper music promo',film:'Cold Wrapper'},['ah-1','Arctic Hospital, Citystream digipak front cover'],['ah-2','Arctic Hospital, Citystream digipak spine'],['ah-3','Arctic Hospital, Citystream back cover and track list'],['ah-4b','Arctic Hospital, Citystream disc'],['ah-5','Arctic Hospital, Citystream digipak opened']]},
 {n:'06',title:'Narita Records _ Label Sleeve',tag:'Vinyl packaging',tile:'narita-sleeve',fit:'cover',frames:[['narita-sleeve','Narita Records 12-inch sleeve, front'],['narita-detail','Narita sleeve, detail of the yellow label in the die-cut window']]},
 {n:'07',title:'Absorber',tag:'Short film _ identity & main titles',tile:'absorber-hi',fit:'contain',frames:[
  ['ab-1-title','Absorber main title over a dark desert horizon at sunrise'],['ab-2-sheet','End title sequence, contact sheet of all credit cards'],['ab-3-written','Written, directed and scored by Noah Conopask'],['ab-4-cast','Cast credit: Grant Narasin, Annika Ross'],['ab-5-dop','Director of photography Eric Ulbrich'],['ab-6-aerials','Aerials provided by Lithium Aerials, pilot Aaron Cohan'],['ab-7-pas','Production assistants credit'],['ab-8-track','Opening track The Siren by New Ruin'],['ab-9-pillage','A Pillage Corp production']]},
 {n:'08',title:'Totality',tag:'Film identity & main titles',tile:'tot-1-tile',fit:'cover',frames:[['tot-1','Totality title over a total solar eclipse'],['logo-totality','Totality wordmark']]},
 {n:'09',title:'Anders Ilar _ Nightwidth',tag:'Music packaging',tile:'anders-ilar',fit:'cover',frames:[['anders-1','Nightwidth box set, front'],['anders-2b','Nightwidth box set, back cover'],['anders-3','Nightwidth stencil type, detail'],['anders-4','Nightwidth stencil type, angle'],['anders-5','Nightwidth stencil type, close']]},
 {n:'10',title:"REV'IT!",tag:'Film & photography',tile:'revit-tile',fit:'cover',frames:[{vimeo:'477161035',poster:'revit-poster',alt:"REV'IT!, The Reason, Super 8 film",film:'The Reason',ar:'79/60'},['revit','Rider in a flame-painted helmet']]},
 {n:'11',title:'Logos',tag:'Brand identity',tile:'logo-nr',fit:'cover',frames:[['logo-nr','New Ruin logo'],['logos','noah.tv logomark usage guidelines'],['logo-absorber','Absorber wordmark'],['logo-leaf','Three-leaf mark'],['logo-noahtv','noah.tv logomark'],['logo-narita','Narita Records wordmark'],['logo-totality','Totality wordmark']]},
 {n:'12',title:'Merck Records _ Label Sleeve',tag:'Vinyl packaging',tile:'merck-tile',fit:'cover',frames:[['merck-1','Merck Records 12-inch sleeve, hand-drawn line work with a blue logo, front']]}
].map(p=>({...p,frames:p.frames.map(f=>Array.isArray(f)?{src:I(f[0]),alt:f[1]}:{vimeo:f.vimeo,src:I(f.poster),alt:f.alt,film:f.film,ar:f.ar})}));
const ROWS=[[0,1,2,3,'narrow'],[4,5,'wide'],[6,7,'wide'],[8,9,10,11,'narrow']];
const $=id=>document.getElementById(id);
const tt=t=>t.split(' _ ').map(x=>`<span class="nw">${esc(x)}</span>`).join(' _ ');
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const VIMEO='https://player.vimeo.com';
const START=Math.max(0,P.findIndex(p=>p.title.startsWith('Cruel Black Dove')));
let a=START,f=0,frame=null,paused=false,swapT=null;

$('rows').innerHTML=ROWS.map(r=>{const cls=r[r.length-1],ids=r.slice(0,-1),basis=cls==='wide'?440:240;
 return `<div class="row ${cls}">`+ids.map(i=>{const p=P[i];return `<article style="flex:1 1 ${basis}px;min-width:0"><button type="button" class="tile" data-i="${i}"><img loading="lazy" src="${I(p.tile)}" alt="${esc(p.frames[0].alt)}"><span class="tl"><span class="t">${tt(p.title)}</span><span class="g">${esc(p.tag)}</span></span></button></article>`;}).join('')+'</div>';}).join('');

const VIDS=[];P.forEach((p,pi)=>p.frames.forEach((fr,fi)=>{if(fr.vimeo)VIDS.push({a:pi,f:fi,id:fr.vimeo,client:p.title,title:fr.film||'Film',poster:fr.src,ar:fr.ar,label:p.title+' _ '+(fr.film||'film')});}));
const PL=$('player'),PF=$('pframe'),PC=$('pcap');
let vi=0,lastFocus=null,pswapT=null;
function send(cmd){if(frame&&frame.contentWindow)frame.contentWindow.postMessage(JSON.stringify(cmd),VIMEO);}
function setPaused(p){paused=p;$('pstate').textContent=p?'RESUME':'PAUSE';}
function loadFilm(){
 const v=VIDS[vi];setPaused(false);
 $('pclient').textContent=v.client;$('ptitle').textContent=v.title;
 $('pcount').textContent=String(vi+1).padStart(2,'0')+' / '+String(VIDS.length).padStart(2,'0');
 const one=VIDS.length<2;$('pprev').disabled=one;$('pnext').disabled=one;
 const url=`${VIMEO}/video/${v.id}?autoplay=1&controls=0&title=0&byline=0&portrait=0&badge=0&vimeo_logo=0&sidedock=0&pip=0&loop=0&autopause=1&dnt=1&texttrack=false&api=1&player_id=p${v.id}`;
 PF.classList.remove('live');
 {const [w,h]=(v.ar||'16/9').split('/').map(Number);PF.style.setProperty('--ar',w+'/'+h);PF.style.setProperty('--arn',(w/h).toFixed(4));}
 PF.innerHTML=`<img src="${v.poster}" alt=""><iframe src="${url}" title="${esc(v.label)}" allow="autoplay; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="strict-origin-when-cross-origin"></iframe><button type="button" class="hit" aria-label="Pause or resume ${esc(v.label)}"></button>`;
 frame=PF.querySelector('iframe');
 frame.addEventListener('load',()=>setTimeout(()=>PF.classList.add('live'),600));
}
function openFilm(pa,pf){
 vi=Math.max(0,VIDS.findIndex(v=>v.a===pa&&v.f===pf));
 lastFocus=document.activeElement;loadFilm();
 document.body.classList.add('screening');PL.setAttribute('aria-hidden','false');
 requestAnimationFrame(()=>PL.classList.add('on'));
 setTimeout(()=>PL.focus({preventScroll:true}),50);
}
function closeFilm(ended){
 if(!PL.classList.contains('on'))return;
 clearTimeout(pswapT);send({method:'pause'});
 PL.classList.remove('on');PL.setAttribute('aria-hidden','true');document.body.classList.remove('screening');
 setTimeout(()=>{if(!PL.classList.contains('on')){PF.innerHTML='';frame=null;}},650);
 const v=VIDS[vi];
 if(v&&a===v.a&&ended&&P[a].frames.length>v.f+1)show(v.f+1);
 if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}
function stepFilm(d){
 if(VIDS.length<2)return;send({method:'pause'});
 PF.classList.add('swap');PC.classList.add('swap');clearTimeout(pswapT);
 pswapT=setTimeout(()=>{vi=(vi+d+VIDS.length)%VIDS.length;const v=VIDS[vi];if(a!==v.a){a=v.a;f=v.f;renderCaption();renderThumbs();renderStage();}loadFilm();PF.classList.remove('swap');PC.classList.remove('swap');},450);
}
function toggle(){send({method:paused?'play':'pause'});setPaused(!paused);}
addEventListener('message',e=>{if(!frame||e.source!==frame.contentWindow)return;let d=e.data;try{if(typeof d==='string')d=JSON.parse(d);}catch(_){return;}if(!d)return;
 if(d.event==='ready'){['ended','pause','play'].forEach(v=>send({method:'addEventListener',value:v}));send({method:'disableTextTrack'});}
 else if(d.event==='ended'||d.event==='finish')closeFilm(true);
 else if(d.event==='pause')setPaused(true);
 else if(d.event==='play')setPaused(false);
});
addEventListener('keydown',e=>{if(!PL.classList.contains('on'))return;
 if(e.key==='Escape')closeFilm();else if(e.key==='ArrowLeft')stepFilm(-1);else if(e.key==='ArrowRight')stepFilm(1);
 else if(e.key===' '&&!e.target.closest('button')){e.preventDefault();toggle();}
 else if(e.key==='Tab'){const b=[...PL.querySelectorAll('button:not([disabled])')].filter(x=>x.offsetParent);if(!b.length)return;const i=b.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();b[b.length-1].focus();}else if(!e.shiftKey&&i===b.length-1){e.preventDefault();b[0].focus();}}
});
function renderStage(){
 const p=P[a],fr=p.frames[f],st=$('stage');
 st.style.aspectRatio=p.aspect||'3 / 2';
 st.classList.toggle('cover',p.fit==='cover');
 st.classList.remove('live');frame=null;
 if(fr.vimeo){
  st.innerHTML=`<img src="${fr.src}" alt="${esc(fr.alt)}" style="opacity:.55"><button type="button" class="hit openfilm" aria-label="Play ${esc(p.title)}, ${esc(fr.film||'film')}"></button><span class="play" aria-hidden="true"><span><svg width="52" height="52" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span></span>`;
 }else{
  st.innerHTML=`<button type="button" class="still" aria-label="Next image"><img src="${fr.src}" alt="${esc(fr.alt)}"></button>`;

 }
}
function renderThumbs(){
 const p=P[a],many=p.frames.length>1;
 $('trow').style.display=many?'':'none';
 $('thumbs').innerHTML=p.frames.map((fr,i)=>`<button type="button" class="th${p.fit==='cover'?' cover':''}" data-f="${i}" aria-label="${fr.vimeo?'Play film':'Show image '+(i+1)+' of '+p.frames.length}" aria-current="${i===f}"><img src="${fr.src}" alt="" style="aspect-ratio:${p.aspect||'3 / 2'}">${fr.vimeo?'<span class="pi" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l10.5-6.5z"/></svg></span>':''}</button>`).join('');
 const over=p.frames.length>9;$('tback').hidden=!over;$('tfwd').hidden=!over;
 $('thumbs').scrollLeft=0;
}
function markThumb(){
 const c=$('thumbs');[...c.children].forEach((t,i)=>t.setAttribute('aria-current',i===f));
 const t=c.children[f];if(!t)return;const l=t.offsetLeft,r=l+t.offsetWidth;
 if(l<c.scrollLeft)c.scrollTo({left:l-4});else if(r>c.scrollLeft+c.clientWidth)c.scrollTo({left:r-c.clientWidth+4});
}
function renderCaption(){
 const p=P[a];$('ct').innerHTML=tt(p.title);$('cg').textContent=p.tag;
 $('counter').textContent=p.n+' / 12';
 document.querySelectorAll('.tile').forEach(t=>t.setAttribute('aria-current',+t.dataset.i===a));
}
function show(nf){ // change frame within project, with a short fade
 if(nf===f)return;
 const st=$('stage');st.classList.add('swap');clearTimeout(swapT);
 swapT=setTimeout(()=>{f=nf;renderStage();markThumb();st.classList.remove('swap');},300);
}
function open(i,scroll){
 const st=$('stage');st.classList.add('swap');clearTimeout(swapT);
 swapT=setTimeout(()=>{a=(i+12)%12;f=0;renderCaption();renderThumbs();renderStage();st.classList.remove('swap');
  if(P[a].frames[0].vimeo)setTimeout(()=>openFilm(a,0),scroll?500:150);},300);
 if(scroll)$('viewer').scrollIntoView({behavior:'smooth',block:'start'});
}
function home(){
 closeFilm();clearTimeout(swapT);
 if(location.hash)history.replaceState(null,'',location.pathname+location.search);
 if(a!==START||f!==0){a=START;f=0;renderCaption();renderThumbs();renderStage();}
 scrollTo({top:0,behavior:'smooth'});
}
document.addEventListener('click',e=>{
 if(e.target.closest('a.home')&&!(e.metaKey||e.ctrlKey||e.shiftKey)){e.preventDefault();home();return;}
 const tile=e.target.closest('.tile');if(tile){open(+tile.dataset.i,true);return;}
 if(e.target.closest('.pclose')){closeFilm();return;}
 if(e.target.closest('#pprev')){stepFilm(-1);return;}
 if(e.target.closest('#pnext')){stepFilm(1);return;}
 if(e.target.closest('#pframe .hit,#pstate')){toggle();return;}
 if(e.target.closest('.openfilm')){openFilm(a,f);return;}
 const th=e.target.closest('.th');if(th){const nf=+th.dataset.f;if(P[a].frames[nf].vimeo){show(nf);setTimeout(()=>openFilm(a,nf),320);}else show(nf);return;}
 if(e.target.closest('.still')){show((f+1)%P[a].frames.length);return;}
 if(e.target.closest('#prev'))open(a-1);
 else if(e.target.closest('#next'))open(a+1);
 else if(e.target.closest('#tback'))$('thumbs').scrollBy({left:-$('thumbs').clientWidth*.8});
 else if(e.target.closest('#tfwd'))$('thumbs').scrollBy({left:$('thumbs').clientWidth*.8});
});
renderCaption();renderThumbs();renderStage();
</script>
</body>
</html>
